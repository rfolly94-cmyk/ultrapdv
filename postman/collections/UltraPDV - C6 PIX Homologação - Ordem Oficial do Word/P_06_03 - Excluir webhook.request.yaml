$kind: http-request
url: "{{pix_base}}/webhook/{{chave_pix}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 204', function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 25000
