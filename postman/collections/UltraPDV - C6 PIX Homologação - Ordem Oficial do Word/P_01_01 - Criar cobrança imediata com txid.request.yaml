$kind: http-request
url: "{{pix_base}}/cob/{{txid_imediata}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "calendario": {
        "expiracao": 3600
      },
      "devedor": {
        "cnpj": "{{cnpj}}",
        "nome": "{{nome_devedor}}"
      },
      "valor": {
        "original": "1.00"
      },
      "chave": "{{chave_pix}}",
      "solicitacaoPagador": "Teste de homologacao UltraPDV"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 201', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 2000
