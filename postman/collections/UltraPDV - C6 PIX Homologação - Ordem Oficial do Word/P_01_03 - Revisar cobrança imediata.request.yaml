$kind: http-request
url: "{{pix_base}}/cob/{{txid_imediata}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "valor": {
        "original": "1.01"
      },
      "solicitacaoPagador": "Teste de revisao homologacao UltraPDV"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 201', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 4000
