$kind: http-request
url: "{{pix_base}}/cobv?inicio={{inicio}}&fim={{fim}}"
method: GET
queryParams:
  inicio: "{{inicio}}"
  fim: "{{fim}}"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 10000
