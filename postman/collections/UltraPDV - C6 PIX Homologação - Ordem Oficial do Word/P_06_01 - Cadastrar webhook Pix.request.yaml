$kind: http-request
description: Preencha webhook_url com uma URL HTTPS pública antes de executar.
url: "{{pix_base}}/webhook/{{chave_pix}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "webhookUrl": "{{webhook_url}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 23000
