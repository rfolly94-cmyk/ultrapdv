$kind: http-request
description: Exige e2eid válido de um PIX recebido.
url: "{{pix_base}}/pix/{{e2eid}}/devolucao/{{id_devolucao}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "valor": "{{valor_devolucao}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 201', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 21000
