$kind: http-request
description: Preencha a variável e2eid com um PIX realmente recebido no Sandbox antes de executar.
url: "{{pix_base}}/pix/{{e2eid}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status esperado: 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 19000
